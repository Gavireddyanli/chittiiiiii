<!DOCTYPE html>

  <style>

      background: url('images/animated-bg.gif') no-repeat center center fixed;

      text-align: center;
    }

    h1 {
      margin-top: 50px;
      font-size: 60px;
      text-shadow: 2px 2px 5px pink;
    }

      background: rgba(255,255,255,0.6);

      padding: 20px;

    }

    .rose-scene {
      display: block;
      margin: 40px auto;
      width: 300px;
      border: 5px solid white;
      border-radius: 15px;
      box-shadow: 0 0 20px pink;
    }
  </style>
</head>
<body>
  <h1>Happy Rose Day 🌹</h1>
  <p>
    Chitti highlight nice font of chitti entha express chesthunna,<br>
    I feel inka cheppali anipisthundhi.<br>
    You are the first person I truly felt love with.<br>
    Nuvvu vuntey chalu anna feeling, nothing else matters.<br>
    Happy Rose Day ❤️
  </p>

  <!-- Boy giving rose to girl image -->
